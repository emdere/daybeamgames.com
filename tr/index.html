<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Harika bir şey yolda. Sitemiz yapım aşamasında." />
    <title>Daybeam Games — Çok Yakında</title>
    <link rel="alternate" hreflang="en" href="https://daybeamgames.com/" />
    <link rel="alternate" hreflang="tr" href="https://daybeamgames.com/tr/" />
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <!-- Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Sora:wght@700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/home.css" />
</head>
<body>

    <!-- Dynamic Background -->
    <div class="bg-container" id="bg-container">
        <div class="bg-element bg-1"></div>
        <div class="bg-element bg-2"></div>
        <!-- Particles added via script -->
    </div>

    <nav class="lang-switch" aria-label="Language"><a href="../">EN</a><span aria-current="true">TR</span></nav>

    <main class="page-wrapper">
        <div class="status-badge" role="status">
            Harika Bir Şey Geliyor
        </div>

        <div class="main-hero">
            <h1>Sizin için inşa ediyoruz</h1>
            <p>Yapım Aşamasında &bull; Çok Yakında</p>
        </div>

        <div class="hero-image-wrapper">
            <img
                src="https://cdni.iconscout.com/illustration/premium/thumb/coder-illustration-svg-download-png-2895977.png"
                alt="Coder Illustration"
                class="hero-image"
            />
        </div>
    </main>

    <footer>
      <div class="footer-divider" aria-hidden="true"></div>

      <!-- Contact cta -->
      <a
        href="mailto:support@daybeamgames.com"
        class="footer-cta"
        id="contact-cta"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/>
        </svg>
        Bizimle iletişime geçin
        <!-- Arrow -->
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </a>

      <!-- Legal -->
      <p class="footer-credits footer-links">
        <a href="terms/">Hizmet Şartları</a>
        <a href="privacy/">Gizlilik Politikası</a>
        <a href="delete-account/">Hesap Silme</a>
      </p>
      <p class="footer-bottom">&copy; <span id="year"></span> Daybeam Games</p>
    </footer>

    <script>
      // Update year automatically
      document.getElementById('year').textContent = new Date().getFullYear();

      // Create particles
      const container = document.getElementById('bg-container');
      const particleCount = 20;

      for (let i = 0; i < particleCount; i++) {
        const p = document.createElement('div');
        p.className = 'particle';

        // Random size
        const size = Math.random() * 5 + 2 + 'px';
        p.style.width = size;
        p.style.height = size;

        // Random position
        p.style.left = Math.random() * 100 + 'vw';
        p.style.top = Math.random() * 100 + 'vh';

        // Random animation delay and duration
        p.style.animationDelay = Math.random() * 15 + 's';
        p.style.animationDuration = Math.random() * 10 + 10 + 's';

        container.appendChild(p);
      }
    </script>
</body>
</html>
